name: Deploy to PyPi
on:  
  release:     
    types: [published]  
jobs:  
  upload:  
    environment:
      name: release
      url: https://pypi.org/p/openserver
    permissions:
      contents: read
      id-token: write
    
    runs-on: ubuntu-latest
    steps:        
      - name: "Check out code"
        uses: actions/checkout@v3

      - name: "Set up uv"
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.11"

      - name: "Build distributions"
        run: |
          uv build
          uv tool run twine check dist/*
          
      - name: "Publish package distributions to PyPI"
        uses: pypa/gh-action-pypi-publish@release/v1
        